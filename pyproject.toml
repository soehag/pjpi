[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnmesh"
version = "0.1.0"
description = "Utilities for mesh-based model information, gradients, transformations, Gauss-Newton inversions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy",
	"scipy",
	"matplotlib",
	"pygimli",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gnmesh*"]
